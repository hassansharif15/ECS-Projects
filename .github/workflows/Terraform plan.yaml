name: Terraform Plan

on:
  push:
    branches:
      - deployment
    paths:
      - "Terraform/**"
      - ".github/workflows/terraform-plan.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Terraform

    env:
      TFVARS_B64: ${{ secrets.TFVARS_B64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      # Security Scan (DevSecOps)
      
      - name: Run tfsec (Terraform security scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: Terraform
          soft_fail: false

      
      # Setup Terraform
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      
      # Terraform formatting (tracked files only)
      
      - name: Terraform fmt (check tracked files only)
        run: |
          files=$(git ls-files '*.tf' '*.tfvars' '*.tf.json' '*.tfvars.json')
          if [ -n "$files" ]; then
            terraform fmt -check $files
          fi

      
      # Configure AWS via OIDC
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      
      # Restore tfvars from GitHub Secret
      
      - name: Restore terraform.tfvars
        run: |
          if [ -z "$TFVARS_B64" ]; then
            echo "Missing TFVARS_B64 secret"
            exit 1
          fi
          echo "$TFVARS_B64" | base64 -d > terraform.tfvars
          sed -i 's/\r$//' terraform.tfvars
          test -f terraform.tfvars && echo "tfvars restored ✅"

      
      # Terraform Init / Validate / Plan
      
      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color
